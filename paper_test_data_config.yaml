# Paper Test Data — SA2VA Evaluation Config
# ==========================================
# Created for running SA2VA on Paper_test_data images
# Strategies: sa2va (direct segmentation, no SAM3)

# Data paths - point to Paper_test_data
data:
  base_dir: "/home/woody/iwnt/iwnt164h/Paper_test_data"
  rgb_subfolder: "sharpen_rgb/PNG"
  depth_subfolder: "marigold_zero_shot/depth_colored"

# Model configuration
model:
  # SA2VA model (used with --strategy sa2va)
  sa2va:
    name: "Sa2VA-Qwen3-VL-4B"
    hf_model_id: "ByteDance/Sa2VA-Qwen3-VL-4B"

  # VLM models (only used for zero_shot/few_shot/two_vlm strategies)
  reasoner:
    name: "Qwen2.5-VL-7B-Instruct"
    hf_model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
    quantization: "4bit"
    dtype: "auto"
    max_new_tokens: 1024
    temperature: 0.1

  evaluator:
    name: "Qwen2.5-VL-7B-Instruct"
    hf_model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
    quantization: "4bit"
    dtype: "auto"
    max_new_tokens: 512
    temperature: 0.1

  # SAM3 segmentation (only used for VLM strategies)
  segmentation:
    method: "sam3"
    sam3_model_id: "facebook/sam3"
    sam3_mask_threshold: 0.5
    sam3_input_mode: "text_only"
    device: "cuda"

# Pipeline settings
pipeline:
  strategy: "sa2va"                # zero_shot | few_shot | two_vlm | sa2va
  input_mode: "rgb_depth_separate" # rgb_only | rgb_depth_separate
  depth_flatness_threshold: 80
  image_max_side: 896              # Resize longest side (SA2VA input)

# Output settings
output:
  dir: "/home/woody/iwnt/iwnt164h/Paper_test_data_experiments"
  save_individual_json: true
  save_visualizations: true
