# Unified Free Ground Space Detection Pipeline
# ==============================================
# Strategies: zero_shot, few_shot, two_vlm
# Pipeline: VLM(s) → SAM3 Segmentation

# Data paths
data:
  base_dir: "/home/woody/iwnt/iwnt164h/mlp_dataset/prospthesisproject-Data/Code/Data"
  rgb_subfolder: "sharpen_rgb/PNG"
  depth_subfolder: "marigold_zero_shot/depth_colored"

# Model configuration
model:
  # Default model (used for all strategies unless overridden)
  # Override with: --model, --reasoner_model, --evaluator_model
  reasoner:
    name: "Qwen2.5-VL-7B-Instruct"
    hf_model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
    quantization: "4bit"
    dtype: "auto"
    max_new_tokens: 1024
    temperature: 0.1

  evaluator:
    name: "Qwen2.5-VL-7B-Instruct"
    hf_model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
    quantization: "4bit"
    dtype: "auto"
    max_new_tokens: 512
    temperature: 0.1

  # SAM3 segmentation
  segmentation:
    method: "sam3"
    sam3_model_id: "facebook/sam3"
    sam3_mask_threshold: 0.5
    device: "cuda"

# Pipeline settings
pipeline:
  strategy: "two_vlm"          # zero_shot | few_shot | two_vlm
  input_mode: "rgb_depth_separate"  # rgb_only | rgb_depth_separate
  depth_flatness_threshold: 80
  few_shot_dir: null           # Required for few_shot strategy
  num_examples: 3              # Number of few-shot examples

# Output settings
output:
  dir: "/home/woody/iwnt/iwnt164h/free_ground_results"
  save_individual_json: true
  save_visualizations: true

# =====================================================================
# USAGE EXAMPLES
# =====================================================================
#
# 1. Zero-shot (single VLM):
#    python lac_pipeline.py --strategy zero_shot --model Qwen2.5-VL-7B-Instruct --input_mode rgb_only
#
# 2. Few-shot (single VLM with examples):
#    python lac_pipeline.py --strategy few_shot --model Qwen2.5-VL-7B-Instruct \
#        --input_mode rgb_depth_separate --few_shot_dir $WORK/mlp_ground_truth/proper_annotations
#
# 3. Two-VLM (same model):
#    python lac_pipeline.py --strategy two_vlm --model Qwen2.5-VL-7B-Instruct --input_mode rgb_depth_separate
#
# 4. Two-VLM (different models):
#    python lac_pipeline.py --strategy two_vlm \
#        --reasoner_model Qwen2.5-VL-7B-Instruct --evaluator_model gemma-4-E4B-it \
#        --input_mode rgb_depth_separate
#
# Available models:
#   Qwen2.5-VL-7B-Instruct  (7B, 4-bit, rtx3080 partition)
#   gemma-4-E4B-it           (4B, float16, v100 partition)
#
# Segmentation:
#   facebook/sam3             (0.8B, text-prompted)
# =====================================================================
